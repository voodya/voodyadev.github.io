<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка баланса и подпись строки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f0f0;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .input-section {
            flex: 1;
            min-width: 300px;
        }
        .wallet-section {
            flex: 1;
            min-width: 200px;
            text-align: left;
        }
        input, select {
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        #connectButton {
            background-color: #6200ea;
            color: white;
        }
        #connectButton:hover {
            background-color: #3700b3;
        }
        #disconnectButton {
            background-color: #d32f2f;
            color: white;
            display: none;
        }
        #disconnectButton:hover {
            background-color: #b71c1c;
        }
        #reconnectButton {
            background-color: #0288d1;
            color: white;
            display: none;
        }
        #reconnectButton:hover {
            background-color: #01579b;
        }
        #signButton {
            background-color: #388e3c;
            color: white;
            display: none;
        }
        #signButton:hover {
            background-color: #2e7d32;
        }
        #status, #balance, #signatureResult {
            margin-top: 20px;
            font-size: 16px;
        }
        .error {
            color: #ff5555;
        }
        #walletDisplay {
            margin-top: 10px;
            font-size: 14px;
            word-break: break-all;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-section">
            <h1>Проверка баланса и подпись строки</h1>
            <select id="walletType">
                <option value="metamask">MetaMask</option>
                <option value="walletconnect">WalletConnect</option>
            </select>
            <input id="messageInput" type="text" placeholder="Введите строку для подписи">
            <div>
                <button id="connectButton">Подключиться</button>
                <button id="disconnectButton" disabled>Отключить кошелек</button>
                <button id="reconnectButton" disabled>Подключить заново</button>
                <button id="signButton" disabled>Подписать</button>
            </div>
            <div id="status">Статус: Не подключено</div>
            <div id="balance">Баланс: N/A</div>
            <div id="signatureResult">Подпись: N/A</div>
        </div>
        <div class="wallet-section">
            <h3>Адрес кошелька</h3>
            <div id="walletDisplay">Не подключено</div>
        </div>
    </div>

    <!-- Подключаем MetaMask SDK -->
    <script src="https://c0f4f41c-2f55-4863-921b-sdk-docs.github.io/cdn/metamask-sdk.js"></script>

    <!-- Подключаем WalletConnect через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.21.1/dist/index.umd.min.js" onerror="console.error('Ошибка загрузки WalletConnect UMD'); document.getElementById('status').textContent = 'Статус: WalletConnect не доступен'; document.getElementById('status').classList.add('error');"></script>

    <!-- Подключаем ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"></script>

    <script type="module">
        window.addEventListener('DOMContentLoaded', () => {
            const walletTypeSelect = document.getElementById('walletType');
            const connectButton = document.getElementById('connectButton');
            const disconnectButton = document.getElementById('disconnectButton');
            const reconnectButton = document.getElementById('reconnectButton');
            const signButton = document.getElementById('signButton');
            const messageInput = document.getElementById('messageInput');
            const statusDiv = document.getElementById('status');
            const balanceDiv = document.getElementById('balance');
            const signatureResultDiv = document.getElementById('signatureResult');
            const walletDisplay = document.getElementById('walletDisplay');
            let provider;
            let MMSDK;
            let wcProvider;
            let walletType;

            // Функция для выполнения RPC-запроса с повторными попытками
            async function withRetries(fn, maxRetries = 3, delay = 2000) {
                for (let attempt = 1; attempt <= maxRetries; attempt++) {
                    try {
                        return await fn();
                    } catch (error) {
                        if (attempt === maxRetries || !error.message.includes('timed out')) {
                            throw error;
                        }
                        console.warn(`Попытка ${attempt} не удалась: ${error.message}. Повтор через ${delay}мс`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    }
                }
            }
            
            // Проверка сети
            async function ensureNetwork(ethersProvider, targetChainId = 1) {
                let network;
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        network = await withRetries(() => ethersProvider.getNetwork());
                        if (Number(network.chainId) === targetChainId) {
                            return true;
                        }
                        break; // Если сеть неверная, выходим из цикла и переключаем
                    } catch (error) {
                        console.warn(`Попытка ${attempt} проверки сети не удалась: ${error.message}`);
                        if (attempt === 3) throw error;
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    }
                }

                try {
                    await withRetries(() => provider.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: `0x${targetChainId.toString(16)}` }],
                    }));
                    statusDiv.textContent = 'Статус: Переключено на Polygon';
                    return true;
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await withRetries(() => provider.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: `0x${targetChainId.toString(16)}`,
                                chainName: 'Polygon Mainnet',
                                nativeCurrency: {
                                    name: 'MATIC',
                                    symbol: 'MATIC',
                                    decimals: 18,
                                },
                                rpcUrls: ['https://polygon-rpc.com'],
                                blockExplorerUrls: ['https://polygonscan.com/'],
                            }],
                        }));
                        statusDiv.textContent = 'Статус: Сеть Polygon добавлена';
                        return true;
                    }
                    throw new Error(`Ошибка переключения сети: ${switchError.message}`);
                }
            }

            // Показать дополнительные кнопки
            function showAdditionalButtons() {
                disconnectButton.style.display = 'inline-block';
                reconnectButton.style.display = 'inline-block';
                signButton.style.display = 'inline-block';
            }

            // Скрыть дополнительные кнопки
            function hideAdditionalButtons() {
                disconnectButton.style.display = 'none';
                reconnectButton.style.display = 'none';
                signButton.style.display = 'none';
            }

            // Инициализация MetaMask
            async function initializeMetaMask() {
                try {
                    console.log('Инициализация MetaMask: начата');
                    MMSDK = new MetaMaskSDK.MetaMaskSDK({
                        dappMetadata: {
                            name: 'Polygon DApp',
                            url: window.location.href,
                        },
                        shouldShimWeb3: true,
                    });
                    await MMSDK.connect();
                    provider = MMSDK.getProvider();
                    if (!provider) {
                        throw new Error('MetaMask провайдер не инициализирован');
                    }
                    console.log('MetaMask: подключение успешно');
                    return true;
                } catch (error) {
                    throw new Error(`MetaMask инициализация не удалась: ${error.message}`);
                }
            }

            // Инициализация WalletConnect
            async function initializeWalletConnect() {
                try {
                    // Получаем WalletConnectProvider
                    const WalletConnectProvider = window['@walletconnect/ethereum-provider']?.EthereumProvider;
                    if (!WalletConnectProvider) {
                        throw new Error('WalletConnectProvider не найден.');
                    }

                    console.log('Инициализация WalletConnect: начата');
                    wcProvider = await WalletConnectProvider.init({
                        projectId: '3040808e3c4a19a9897743f7772df475',
                        chains: [137],
                        optionalChains: [137],
                        showQrModal: true,
                        qrcodeModalOptions: {
                            mobileLinks: ['metamask', 'trust', 'coinbase'],
                        },
                        rpcMap: {
                            137: 'https://polygon-rpc.com',
                        },
                        metadata: {
                            name: 'Polygon DApp',
                            description: 'DApp на Polygon',
                            url: window.location.href,
                            icons: ['https://walletconnect.com/walletconnect-logo.png'],
                        },
                    });

                    console.log('WalletConnect: init завершён, начинаем connect');
                    if (!wcProvider.connected) {
                        await wcProvider.connect();
                        console.log('WalletConnect: подключение успешно');
                    } else {
                        console.log('WalletConnect: уже подключён');
                    }
                    provider = wcProvider;
                    return true;
                } catch (error) {
                    throw new Error(`WalletConnect инициализация не удалась: ${error.message}`);
                }
            }

            // Подключение кошелька
            async function connectWallet() {
                walletType = walletTypeSelect.value;
                statusDiv.classList.remove('error');

                try {
                    if (walletType === 'metamask') {
                        await initializeMetaMask();
                        statusDiv.textContent = 'Статус: MetaMask инициализирован';
                    } else if (walletType === 'walletconnect') {
                        await initializeWalletConnect();
                        statusDiv.textContent = 'Статус: WalletConnect инициализирован';
                    }
                    showAdditionalButtons();
                } catch (error) {
                    statusDiv.textContent = `Статус: Ошибка инициализации - ${error.message}`;
                    statusDiv.classList.add('error');
                    console.error('Ошибка инициализации:', error);
                    return false;
                }
                return true;
            }

            // Функция для подключения и получения баланса
            async function connectAndGetBalance() {
                try {
                    if (!provider) {
                        if (!(await connectWallet())) {
                            return;
                        }
                    }

                    let address;
                    try {
                        const accounts = await withRetries(() => provider.request({ method: 'eth_requestAccounts' }));
                        address = accounts[0];
                        
                        walletDisplay.textContent = `Подключённый адрес: ${address}`;
                        statusDiv.textContent = `Статус: Подключено через ${walletType === 'metamask' ? 'MetaMask' : 'WalletConnect'}`;
                    } catch (authError) {
                        statusDiv.textContent = `Статус: Ошибка подключения - ${authError.message}`;
                        statusDiv.classList.add('error');
                        console.error('Ошибка аутентификации:', authError);
                        return;
                    }
                    const ethersProvider = new ethers.BrowserProvider(provider);
                    await ensureNetwork(ethersProvider, 137);
/*
                    const ethersProvider = new ethers.BrowserProvider(provider);
                    const network = await withRetries(() => ethersProvider.getNetwork());
                    const polygonChainId = 137;
                    if (Number(network.chainId) !== polygonChainId) {
                        try {
                            await withRetries(() => provider.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: `0x${polygonChainId.toString(16)}` }],
                            }));
                            statusDiv.textContent = 'Статус: Переключено на Polygon';
                        } catch (switchError) {
                            if (switchError.code === 4902) {
                                await withRetries(() => provider.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: `0x${polygonChainId.toString(16)}`,
                                        chainName: 'Polygon Mainnet',
                                        nativeCurrency: {
                                            name: 'MATIC',
                                            symbol: 'MATIC',
                                            decimals: 18,
                                        },
                                        rpcUrls: ['https://polygon-rpc.com'],
                                        blockExplorerUrls: ['https://polygonscan.com/'],
                                    }],
                                }));
                                statusDiv.textContent = 'Статус: Сеть Polygon добавлена';
                            } else {
                                statusDiv.textContent = 'Статус: Ошибка при переключении сети';
                                statusDiv.classList.add('error');
                                console.error('Ошибка переключения:', switchError);
                                return;
                            }
                        }
                    }
*/
                    console.log(Object.keys(ethersProvider));
                    const balance = await withRetries(() => ethersProvider.getBalance(address));
/*                    const balance = await window.ethereum.request({
    method: 'eth_getBalance',
    params: [address, 'latest'],
  })
 */
 /*
                    const balance = await withRetries(() => provider.request({
  method: 'eth_getBalance',
  params: [address, 'latest'],
}));
*/
                    //const balance = await withRetries(() => ethersProvider.getAccountValue(address, 137));
                    const balanceInMatic = ethers.formatEther(balance);
                    balanceDiv.textContent = `Баланс: ${balanceInMatic} MATIC`;
                    statusDiv.classList.remove('error');

                    disconnectButton.disabled = false;
                    reconnectButton.disabled = false;
                    connectButton.disabled = true;
                    signButton.disabled = !messageInput.value.trim();
                } catch (error) {
                    statusDiv.textContent = `Статус: Ошибка - ${error.message}`;
                    statusDiv.classList.add('error');
                    console.error('Ошибка:', error);
                }
            }

            // Функция для подписи строки
            async function signMessage() {
                try {
                    const message = messageInput.value.trim();
                    if (!message) {
                        statusDiv.textContent = 'Статус: Введите строку для подписи';
                        statusDiv.classList.add('error');
                        return;
                    }

                    if (!provider) {
                        statusDiv.textContent = 'Статус: Кошелек не подключён';
                        statusDiv.classList.add('error');
                        return;
                    }

                    const accounts = await withRetries(() => provider.request({ method: 'eth_accounts' }));
                    if (!accounts || accounts.length === 0) {
                        statusDiv.textContent = 'Статус: Кошелек не подключён';
                        statusDiv.classList.add('error');
                        return;
                    }

                    const address = accounts[0];
                    const messageHex = ethers.hexlify(ethers.toUtf8Bytes(message));
                    const signature = await withRetries(() => provider.request({
                        method: 'personal_sign',
                        params: [messageHex, address],
                    }));
                    signatureResultDiv.textContent = `Подпись: ${signature}`;
                    statusDiv.textContent = 'Статус: Строка успешно подписана';
                    statusDiv.classList.remove('error');
                } catch (error) {
                    statusDiv.textContent = `Статус: Ошибка подписи - ${error.message}`;
                    statusDiv.classList.add('error');
                    console.error('Ошибка подписи:', error);
                }
            }

            // Функция для отключения кошелька
            async function disconnectWallet() {
                try {
                    if (walletType === 'walletconnect' && wcProvider) {
                        await wcProvider.disconnect();
                        wcProvider = null;
                    }
                    provider = null;
                    MMSDK = null;
                    walletType = null;

                    walletDisplay.textContent = 'Не подключено';
                    statusDiv.textContent = 'Статус: Отключено';
                    balanceDiv.textContent = 'Баланс: N/A';
                    signatureResultDiv.textContent = 'Подпись: N/A';
                    statusDiv.classList.remove('error');

                    disconnectButton.disabled = true;
                    reconnectButton.disabled = true;
                    connectButton.disabled = false;
                    signButton.disabled = true;
                    hideAdditionalButtons();
                } catch (error) {
                    statusDiv.textContent = `Статус: Ошибка отключения - ${error.message}`;
                    statusDiv.classList.add('error');
                    console.error('Ошибка отключения:', error);
                }
            }

            // Функция для повторного подключения
            async function reconnectWallet() {
                await disconnectWallet();
                await connectAndGetBalance();
            }

            // Обработчики событий
            connectButton.addEventListener('click', connectAndGetBalance);
            disconnectButton.addEventListener('click', disconnectWallet);
            reconnectButton.addEventListener('click', reconnectWallet);
            signButton.addEventListener('click', signMessage);

            // Активация кнопки подписи при вводе текста
            messageInput.addEventListener('input', () => {
                signButton.disabled = !messageInput.value.trim();
            });
        });
    </script>
</body>
</html>
